on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main

name: CI

jobs:
  # Generated once here and handed to the checks below, so they neither repeat
  # the generation nor disagree about what they are checking. The artifact name
  # carries the language because a spec run shares one namespace across SDKs.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vrchatapi/vrchatapi-rust
          ref: ${{ inputs.ref || github.ref }}

      - uses: vrchatapi/specification/.github/actions/setup-generator@ci/modernise-actions

      - uses: vrchatapi/specification/.github/actions/download@ci/modernise-actions

      - run: bash ./generate.sh openapi.json

      - uses: actions/upload-artifact@v5
        with:
          name: generated-rust
          path: .

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-rust

      - uses: moonrepo/setup-rust@v1.3.0

      - run: cargo test --all

  format:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-rust

      - uses: moonrepo/setup-rust@v1.3.0
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check
