on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      spec-artifact:
        description: >-
          Artifact holding the bundled specification. Only reachable when the
          caller shares this run, so it takes precedence over spec-url.
        required: false
        type: string
        default: ''
      spec-url:
        description: Where to download the specification from.
        required: false
        type: string
        default: https://github.com/vrchatapi/specification/releases/latest/download/openapi.json
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Named explicitly: when this workflow is called, the context belongs to
      # the caller, so a bare checkout would fetch the caller's repository.
      - uses: actions/checkout@v7
        with:
          repository: vrchatapi/vrchatapi-rust
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '20'
          distribution: temurin

      - uses: moonrepo/setup-rust@v1.3.0

      - run: npm install @openapitools/openapi-generator-cli

      - run: ./node_modules/\@openapitools/openapi-generator-cli/main.js version-manager set 7.21.0

      - if: inputs.spec-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.spec-artifact }}
          path: .

      - if: inputs.spec-artifact == ''
        run: curl -Lfo openapi.json "${{ inputs.spec-url || 'https://github.com/vrchatapi/specification/releases/latest/download/openapi.json' }}"

      - run: bash ./generate.sh openapi.json

      # The generator runs with avoidBoxedModels, so a schema that produces a
      # self-referential type fails to compile rather than being boxed.
      - run: cargo build

      - uses: actions/upload-artifact@v7
        with:
          name: rust-${{ github.run_id }}
          path: |
            src
            docs
            Cargo.toml
          if-no-files-found: ignore
