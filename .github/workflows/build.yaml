on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
    inputs:
      spec-artifact:
        description: >-
          Artifact holding the bundled specification. Only reachable when the
          caller shares this run; when empty the latest published one is used.
        required: false
        type: string
        default: ''
      ref:
        description: Ref of this repository to build.
        required: false
        type: string
        default: main

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: vrchatapi/specification/.github/actions/sdk-spec@ci/modernise-actions
        with:
          repository: vrchatapi/vrchatapi-rust
          ref: ${{ inputs.ref || github.ref }}
          generator-version: 7.21.0
          spec-artifact: ${{ inputs.spec-artifact }}

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: '20'
          distribution: temurin

      - uses: moonrepo/setup-rust@v1.3.0

      - run: bash ./generate.sh openapi.json

      # The generator runs with avoidBoxedModels, so a schema that produces a
      # self-referential type fails to compile rather than being boxed.
      - run: cargo build
